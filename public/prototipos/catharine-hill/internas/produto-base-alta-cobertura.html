}
function closeModal(){document.body.classList.remove('modal-open');document.getElementById('modal').innerHTML=''}

function page(){
 return `${HEADER}
 <main>
 <div class="wrap"><div class="pdp-top">
  <div class="gal" id="gal">${gallery()}</div>
  <div class="pbuy">
   <nav class="crumbs" aria-label="Você está em"><a href="${HOME}">Início</a><span>/</span><a href="#">Rosto</a><span>/</span><a href="categoria-bases.html">Bases</a></nav>
   <h1 class="disp">Base Alta Cobertura</h1>
   <p class="line">Angel Wings by Pri Lessa, 40 ml</p>
   <div class="rt">${stars(4.8)}<span>4,8</span><a href="#avaliacoes">312 avaliações</a></div>
   <div class="pprice"><b>${brl(PRICE)}</b><small>ou 3x de ${brl(PRICE/3)} sem juros</small></div>
   <div class="tone" id="tone">${toneBlock()}</div>
   <div id="buyrow">${buyRow()}</div>
   <p class="added" id="added" role="status"></p>
   <div class="ship"><label for="cep">Calcule o frete e o prazo</label><div class="f"><input class="ctrl" id="cep" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="postal-code"><button class="btn ghost" data-cep>Calcular</button></div><div class="note" id="shipOut"><a href="https://buscacepinter.correios.com.br/" target="_blank" rel="noopener">Não sei meu CEP</a></div></div>
   <div class="seals">${[['Cruelty free',I.bunny],['Vegano',I.leaf],['Dermatologicamente testado',I.award],['Não comedogênico',I.award],['Livre de parabenos',I.award]].map(([n,i])=>`<span>${i}${n}</span>`).join('')}</div>
  </div>
 </div></div>

 <section class="wrap" style="padding-bottom:40px"><div class="tabs2" role="tablist" aria-label="Sobre o produto">${['Descrição','Benefícios','Como usar','Especificações'].map((n,i)=>`<button role="tab" aria-selected="${!i}" class="${i?'':'on'}" data-tab="${i}">${n}</button>`).join('')}</div>
  <div class="tabpane" id="tabpane"></div></section>

 <section class="sec" style="padding-top:64px" id="antesdepois"><div class="wrap"><div class="ba-grid">
  <div class="ba-txt"><h2 class="disp h2">Antes e depois</h2><p class="lead" style="margin-top:14px">Arraste a seta para comparar a pele sem maquiagem e com uma camada da Base Alta Cobertura, no tom <b>A4</b>.</p>
   <ul class="ba-facts"><li>Uma camada, aplicada com esponja</li><li>Acabamento natural, sem efeito máscara</li><li>Cobertura de manchas e olheiras</li></ul></div>
  <div id="ba">${beforeAfter()}</div></div></div></section>

 <section class="sec" style="padding-top:32px"><div class="wrap"><div class="head"><div><h2 class="disp h2">Veja em uso</h2><p class="sub" id="useSub">${useSub()}</p></div><div class="arrows"><button data-urail="-1" aria-label="Anterior">${I.left}</button><button data-urail="1" aria-label="Próximo">${I.right}</button></div></div>
  <div class="rail use" id="use">${useCards()}</div><p class="rev-note">Vídeos e perfis ilustrativos, criados para o estudo de caso.</p></div></section>

 <section class="sec" style="padding-top:32px"><div class="wrap"><div class="head"><h2 class="disp h2">Como aplicar</h2></div>
  <div class="howto"><a class="video" href="https://youtu.be/DtOb7HcZOLg" target="_blank" rel="noopener" aria-label="Assistir ao vídeo de aplicação no YouTube"><img src="${U('img/aw-m-a4.webp')}" alt=""><span class="pl">${I.play}</span><span class="cap">Vídeo de aplicação no YouTube</span></a>
  <ol class="steps"><li><div><b>Prepare a pele</b><span>Pele limpa e hidratada. Na pele seca, um creme como o Angel Plast ajuda a base a deslizar.</span></div></li><li><div><b>Aplique em camadas finas</b><span>Com pincel ou esponja, espalhe do centro para fora e construa a cobertura onde precisar.</span></div></li><li><div><b>Sele com pó</b><span>Finalize com o Angel Powder para mais duração, principalmente na zona T.</span></div></li></ol></div></div></section>

 <section class="sec" id="avaliacoes" style="padding-top:32px"><div class="wrap"><div class="rev-head"><h2 class="disp h2">Avaliações</h2><div class="rev-sum"><span class="big">4,8</span><div>${stars(4.8)}<small>312 avaliações, 94% recomendam</small></div></div></div>
  <div id="revs">${reviews()}</div></div></section>

 <section class="sec" style="padding-top:32px"><div class="wrap"><div class="head"><h2 class="disp h2">Quem comprou também levou</h2><div class="arrows"><button data-rail="-1" aria-label="Anterior">${I.left}</button><button data-rail="1" aria-label="Próximo">${I.right}</button></div></div>
  <div class="rail" id="rail">${RECO.map(rcard).join('')}</div></div></section>
 </main>
 ${FOOTER}
 <div class="modal" id="modal"></div>
 <div class="sticky-buy" id="sticky" aria-hidden="true"><div class="wrap"><img id="sImg" src="${U(`img/aw-m-${T().key}.webp`)}" alt=""><div class="t"><b>Base Alta Cobertura Angel Wings</b><span id="sTone">Tom ${T().t}</span></div><span class="p">${brl(PRICE)}</span><button class="btn" data-add tabindex="-1">Adicionar à sacola</button></div></div>`;
}

const TABS=[
 ()=>`<p>Alta cobertura com acabamento natural. Formulada para uma pele uniforme e resistente, com hidratação intensa e um acabamento radiante, agora em 21 tons.</p><p>À prova d’água: mantém a cobertura ao longo do dia, mesmo com suor ou chuva, sem perder o conforto.</p>
  <div class="banners"><h3 class="disp">Os 21 tons e seus fundos</h3><p class="mute">Cada tom foi fotografado em uma pele real, com o fundo (subtom) indicado pela marca.</p>
  <figure><img src="${U('img/aw-banner-1.webp')}" alt="Cartela da Base Alta Cobertura Angel Wings, tons A0 a A5.5, cada um em uma modelo com o fundo indicado" loading="lazy"></figure>
  <figure><img src="${U('img/aw-banner-2.webp')}" alt="Cartela da Base Alta Cobertura Angel Wings, tons A6 a A11, cada um em uma modelo com o fundo indicado" loading="lazy"></figure></div>`,
 ()=>`<div class="ben">${[['Ácido hialurônico','Hidratação intensa e mais elasticidade para a pele.'],['À prova d’água','A cobertura se mantém com suor ou chuva.'],['Acabamento leve','Alta cobertura com aparência de pele, sem efeito máscara.'],['Livre de parabenos','Menos risco de alergia, irritação e sensibilidade.']].map(([a,b])=>`<div><b>${a}</b><p>${b}</p></div>`).join('')}</div>`,
 ()=>`<p>Com a pele limpa e hidratada, aplique a base em todo o rosto com pincel ou esponja, em camadas finas, até chegar à cobertura desejada. Para mais duração, sele com pó.</p>`,
 ()=>`<dl class="spec"><dt>Peso líquido</dt><dd>40 ml</dd><dt>Tons</dt><dd>21, do A0 ao A11</dd><dt>Área de uso</dt><dd>Pele</dd><dt>Acabamento</dt><dd>Natural</dd><dt>Selos</dt><dd>Cruelty free, vegano, dermatologicamente testado, não comedogênico, livre de parabenos</dd><dt>Coleção</dt><dd>Angel Wings by Pri Lessa</dd></dl>`,
];

function refreshTone(){
 document.getElementById('tone').innerHTML=toneBlock();
 document.getElementById('buyrow').innerHTML=buyRow();
 document.getElementById('gal').innerHTML=gallery();
 document.getElementById('revs').innerHTML=reviews();
  document.getElementById('use').innerHTML=useCards();document.getElementById('use').scrollLeft=0;document.getElementById('useSub').textContent=useSub();
 document.getElementById('sImg').src=U(`img/aw-m-${T().key}.webp`);
 document.getElementById('sTone').textContent=`Tom ${T().t}`;
 document.querySelector('#sticky .btn').textContent=T().off?'Avise-me':'Adicionar à sacola';
 bindSticky();
}
let io;
function bindSticky(){
 if(io)io.disconnect();const s=document.getElementById('sticky');const target=document.getElementById('buyrow');
 io=new IntersectionObserver(([e])=>{const on=!e.isIntersecting&&e.boundingClientRect.top<0;s.classList.toggle('on',on);s.setAttribute('aria-hidden',!on);s.querySelector('.btn').tabIndex=on?0:-1},{threshold:0});io.observe(target);
}
function init(){
 document.getElementById('root').innerHTML=page();
 document.getElementById('tabpane').innerHTML=TABS[0]();bindSticky();_initCart();
 document.addEventListener('click',e=>{
  if(e.target.closest('[data-mclose]')||e.target.id==='modal'){closeModal();return}
  const u=e.target.closest('[data-use]');if(u){useModal(+u.dataset.use);return}
  const ut=e.target.closest('[data-usetone]');if(ut){cur=+ut.dataset.usetone;closeModal();refreshTone();document.getElementById('tone').scrollIntoView({behavior:'smooth',block:'center'});return}
  const ur=e.target.closest('[data-urail]');if(ur){const r=document.getElementById('use');r.scrollBy({left:+ur.dataset.urail*r.clientWidth*.8});return}
  const t=e.target.closest('[data-tone],[data-sub],[data-view],[data-q],[data-add],[data-notify],[data-fav],[data-cep],[data-tab],[data-only],[data-photo],[data-allrev],[data-rail]');if(!t)return;
  if(t.dataset.tone!=null){cur=+t.dataset.tone;if(view==='produto'||view==='aberto'||view==='grade')view='modelo';refreshTone();document.querySelector(`[data-tone="${cur}"]`).focus()}
  else if(t.dataset.sub){sub=t.dataset.sub;if(sub!=='todos'&&!T().sub.includes(sub)){const i=TONS.findIndex(x=>x.sub.includes(sub)&&!x.off);if(i>=0)cur=i}refreshTone()}
  else if(t.dataset.view){view=t.dataset.view;document.getElementById('gal').innerHTML=gallery()}
  else if(t.dataset.q){qty=Math.max(1,Math.min(10,qty+ +t.dataset.q));document.getElementById('qty').textContent=qty}
  else if(t.hasAttribute('data-add')){if(T().off){const a=document.getElementById('added');a.textContent='Vamos avisar quando o '+T().t+' voltar.';a.classList.add('on')}else{const it={id:'aw-'+T().key,n:'Base Alta Cobertura',l:'Angel Wings by Pri Lessa',v:'Tom '+T().t,p:PRICE,q:qty,img:'img/aw-p.webp',href:'produto-base-alta-cobertura.html'};CART.add(it);openCart(it.n+', '+it.v)}}
  else if(t.hasAttribute('data-notify')){const a=document.getElementById('added');a.textContent=`Vamos avisar quando o ${T().t} voltar.`;a.classList.add('on')}
  else if(t.hasAttribute('data-fav')){fav=!fav;t.classList.toggle('on',fav);t.setAttribute('aria-pressed',fav);t.setAttribute('aria-label',fav?'Remover dos favoritos':'Salvar nos favoritos');const a=document.getElementById('added');a.textContent=fav?'Salvo nos seus favoritos.':'Removido dos favoritos.';a.classList.add('on')}
  else if(t.hasAttribute('data-cep')){const v=document.getElementById('cep').value.replace(/\D/g,'');const o=document.getElementById('shipOut');o.innerHTML=v.length===8?`<ul><li><b>Econômica</b><span>5 a 8 dias úteis, R$ XX,XX</span></li><li><b>Expressa</b><span>2 a 3 dias úteis, R$ XX,XX</span></li><li><b>Retirar na loja</b><span>Grátis, na Vila da Saúde, SP</span></li></ul>`:`<span style="color:#9b2c2c">Digite um CEP com 8 números.</span> <a href="https://buscacepinter.correios.com.br/" target="_blank" rel="noopener">Não sei meu CEP</a>`}
  else if(t.dataset.tab!=null){document.querySelectorAll('[data-tab]').forEach(b=>{const on=b===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});document.getElementById('tabpane').innerHTML=TABS[+t.dataset.tab]()}
  else if(t.hasAttribute('data-only')){onlyTone=!onlyTone;document.getElementById('revs').innerHTML=reviews()}
  else if(t.hasAttribute('data-photo')){withPhoto=!withPhoto;document.getElementById('revs').innerHTML=reviews()}
  else if(t.hasAttribute('data-allrev')){onlyTone=false;withPhoto=false;skin='todas';document.getElementById('revs').innerHTML=reviews()}
  else if(t.dataset.rail){const r=document.getElementById('rail');r.scrollBy({left:+t.dataset.rail*r.clientWidth*.8})}
 });
 // arraste do antes/depois (mouse e toque); o range invisível fica para teclado e leitor de tela
 let drag=null;const setBA=(el,x)=>{const r=el.getBoundingClientRect();baPos=Math.round(Math.max(0,Math.min(100,(x-r.left)/r.width*100)));el.style.setProperty('--x',baPos+'%');const inp=el.querySelector('.ba-range');inp.value=baPos;inp.setAttribute('aria-valuetext',baPos+'% antes')};
 document.addEventListener('pointerdown',e=>{const el=e.target.closest('.ba');if(!el)return;drag=el;el.setPointerCapture&&el.setPointerCapture(e.pointerId);setBA(el,e.clientX);e.preventDefault()});
 document.addEventListener('pointermove',e=>{if(drag)setBA(drag,e.clientX)});
 document.addEventListener('pointerup',()=>{drag=null});document.addEventListener('pointercancel',()=>{drag=null});
 document.addEventListener('change',e=>{if(e.target.id==='skin'){skin=e.target.value;document.getElementById('revs').innerHTML=reviews()}});
 document.addEventListener('input',e=>{if(e.target.classList.contains('ba-range')){baPos=+e.target.value;e.target.closest('.ba').style.setProperty('--x',baPos+'%');e.target.setAttribute('aria-valuetext',baPos+'% antes');return}if(e.target.id==='cep'){let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('modal-open')){closeModal();return}const b=e.target.closest&&e.target.closest('[data-tone]');if(!b)return;const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();cur=(cur+d+TONS.length)%TONS.length;refreshTone();document.querySelector(`[data-tone="${cur}"]`).focus()}});
}
init();

</script>
